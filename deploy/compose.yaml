volumes:
  pgvector-storage:
  minio-storage:
  kdt-gata-data:

services:
  pgvector-gata:
    image: pgvector/pgvector:pg18
    container_name: pgvector-gata
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgvector-storage:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "gata"]
      interval: 30s
      timeout: 20s
      retries: 3
    environment:
      POSTGRES_DB: gata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  minio-gata:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio-gata
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-storage:/data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    command: server /data --console-address ":9001"
    restart: unless-stopped   # Recommended

  mineru-api-gata:
    image: mineru:latest
    container_name: mineru-api-gata
    restart: unless-stopped
    runtime: nvidia
    stop_grace_period: 30s
    profiles: [ "api" ]
    ports:
      - "8000:8000"
    environment:
      MINERU_MODEL_SOURCE: local
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    entrypoint: mineru-api
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]

  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:cuda
    container_name: llama-swap
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "8789:8080"
    volumes:
      - ${LLM_MODELS_PATH}:/models:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  kdt-gata:
    image: kdt/gata:latest
    ports:
      - "8908:8908"
      - "8909:8909"
    volumes:
      - kdt-gata-data:/var/gata
    depends_on:
      pgvector-gata:
        condition: service_healthy   # recommended (see note below)
    restart: unless-stopped
    environment:
      - DATABASE_URL=jdbc:postgresql://pgvector-gata:5432/gata
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - MINIO_URL=http://minio-gata:9000/
      - MINIO_BUCKET=gata  # if this is blank, minio service will be disabled
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8909