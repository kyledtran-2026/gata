  vision:
#    url: http://10.0.5.111:8789/v1  # VPN - need to load model
    url: http://localhost:8789/v1
    model: gemma-4-31B-it-Q3_K_M
    temperature: 0.0
    top-p: 1
    max-tokens: 8192
  embedding:
