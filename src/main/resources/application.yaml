spring:
  application:
    name: gata
  profiles:
    active: postgres # Sets SQLite as the default if you don't specify one
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 2MB
      location: /tmp/gata/ingest/download

server:
  port: 8908

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{ISO8601} %highlight(%-5level) [%thread] %cyan(%logger{36}):%L - %msg%n"
  #    file: "%d{ISO8601} %-5level [%thread] %logger{36}:%L - %msg%n"
  level:
    root: INFO
    # Quiet Hibernate SQL noise
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN          # parameters
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.orm.jpa: WARN

app-thread-service:
  core-pool-size: 10
  max-pool-size: 20
  await-termination-in-sec: 60

ingestion-service:
  s3-ingest-folder: ingest

pipeline-service:
  s3-rag-folder: rag
  thread-pool-settings:
    core-pool-size: 1
    max-pool-size: 1
    await-termination-in-sec: 120

minio-service:
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  minio-url: ${MINIO_URL}
  bucket: ${MINIO_BUCKET:}
  notify-on-base-folder: true

llm:
  chat:
    url: ${LLM_CHAT_URL:-http://10.0.5.111:8789/v1}
    model: ${LLM_CHAT_MODEL:-gemma-4-31B-it-Q3_K_M}
    temperature: 0.0
    top-p: 1
    max-tokens: 8192
  vision:
    url: ${LLM_VISION_URL:-http://10.0.5.111:8789/v1}
    model: ${LLM_VISION_MODEL:-gemma-4-31B-it-Q3_K_M}
    temperature: 0.0
    top-p: 1
    max-tokens: 8192
  embedding:
    url: ${LLM_EMBEDDING_URL:-http://10.0.5.111:8789/v1}
    model: ${LLM_EMBEDDING_MODEL:-qwen-3-embedding-4b}
    dimension: 1024
    max-retries: 3